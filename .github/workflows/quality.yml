name: Scheduled Quality Diagnostics

permissions: {}

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

jobs:
  diagnostics:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:flake
      - run: SIDEKICK_MUTATION_FULL=1 npm run test:mutation
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: quality-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
