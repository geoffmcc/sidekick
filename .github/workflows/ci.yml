name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sidekick-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched Git history with Gitleaks
        run: >-
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --cpus 2
          --memory 2g
          --pids-limit 64
          --user "$(id -u):$(id -g)"
          --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner --exit-code 1 --log-opts=--all /repo

  fast-gate:
    name: Metadata and architecture gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check:tests
      - run: npm run check:architecture
      - run: npm run check:docs
      - run: node --test test/run-all.test.js test/security/property-boundaries.test.js test/security/security-boundaries.test.js test/core/fault-injection.test.js

  changed-tests:
    name: Changed-test selector / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install OS sandbox backend for changed tests
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - name: Run changed-test selector self-tests
        run: node --test test/scripts-quality-gates.test.js
      - name: Install browser runtime for selected browser tests
        env:
          SIDEKICK_BROWSER_BROWSERS_PATH: ${{ runner.temp }}/sidekick-browsers
        run: node scripts/install-browser.js
      - name: Run changed tests with conservative fallback
        env:
          SIDEKICK_BROWSER_BROWSERS_PATH: ${{ runner.temp }}/sidekick-browsers
        run: SIDEKICK_TEST_BASE="$(git merge-base HEAD origin/main)" npm run test:changed

  resource-contracts:
    name: Resource contracts / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:tests
      - name: Run resource-contract self-tests
        run: node --test test/run-all.test.js

  security:
    name: Security boundaries / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install OS sandbox backend for security tests
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - name: Run security tier with bounded result report
        run: node scripts/run-tests.js --tier=security
      - name: Upload bounded security result summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: security-test-results-${{ matrix.node-version }}
          path: artifacts/test-runs/*/test-results.json
          if-no-files-found: error
          retention-days: 7

  domain-shards:
    name: ${{ matrix.domain }} / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        domain: [core, security, agent, packs, compute, platforms]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install OS sandbox backend for security shard
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - name: Install browser runtime for browser shard only
        if: matrix.domain == 'platforms'
        run: node scripts/install-browser.js
      - name: Run domain shard
        run: node scripts/run-tests.js --domain=${{ matrix.domain }}
      - name: Upload bounded result summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: test-results-${{ matrix.domain }}-${{ matrix.node-version }}
          path: artifacts/test-runs/*/test-results.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Legacy compatibility / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install OS sandbox backend for compatibility tests
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - run: node scripts/run-tests.js --tier=compatibility

  package:
    name: Package, dependency, and lock checks
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Re-resolve the lockfile without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Require a stable package lock
        run: git diff --exit-code -- package-lock.json
      - name: Audit production and CI dependencies
        run: npm audit --audit-level=moderate
      - name: Generate CycloneDX software bill of materials
        run: npm sbom --package-lock-only --sbom-format=cyclonedx --sbom-type=application > sidekick.cdx.json
      - name: Validate generated software bill of materials
        run: node -e "const bom = require('./sidekick.cdx.json'); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components) || !Array.isArray(bom.dependencies) || bom.components.length === 0) process.exit(1)"
      - name: Publish software bill of materials artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: sidekick-cyclonedx-sbom
          path: sidekick.cdx.json
          if-no-files-found: error
          retention-days: 14
      - run: npm run package:worker
      - run: npm pack --dry-run

  proving-inventory:
    name: Proving recipes and pack inventory freshness
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run pack:inventory
      - run: npm run check:docs
      - name: Require deterministic inventory content
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const file = "docs/compatibility-pack-inventory.json";
          const normalize = text => {
            const value = JSON.parse(text);
            delete value.source_commit;
            delete value.source_commit_date;
            return JSON.stringify(value);
          };
          const generated = normalize(fs.readFileSync(file, "utf8"));
          const committed = normalize(execFileSync("git", ["show", `HEAD:${file}`], { encoding: "utf8" }));
          if (generated !== committed) {
            console.error(`${file} is stale or was generated from a different source tree`);
            process.exit(1);
          }
          NODE
      - run: npm run proving:recipes
      - name: Require deterministic proving recipes
        run: git diff --exit-code -- docs/proving-recipes.json

  coverage:
    name: Coverage policy / Node 22
    needs: domain-shards
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install OS sandbox backend for coverage tests
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - name: Install browser runtime for coverage E2E
        env:
          SIDEKICK_BROWSER_BROWSERS_PATH: ${{ runner.temp }}/sidekick-browsers
        run: node scripts/install-browser.js
      - name: Run coverage policy
        env:
          SIDEKICK_BROWSER_BROWSERS_PATH: ${{ runner.temp }}/sidekick-browsers
        run: npm run test:coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: coverage-summary
          path: artifacts/coverage-runs/*/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  hermetic-e2e:
    name: Hermetic end-to-end boundaries
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        env:
          SIDEKICK_BROWSER_BROWSERS_PATH: ${{ runner.temp }}/sidekick-browsers
        run: node scripts/install-browser.js
      - name: Run hermetic E2E
        env:
          SIDEKICK_BROWSER_BROWSERS_PATH: ${{ runner.temp }}/sidekick-browsers
        run: node scripts/run-tests.js --tier=e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: e2e-results
          path: artifacts/test-runs/*/test-results.json
          if-no-files-found: error
          retention-days: 7

  mutation:
    name: Targeted critical mutation gate
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install OS sandbox backend for mutation tests
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - name: Run mutation policy self-tests
        run: node --test test/mutation-policy.test.js
      - run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: mutation-report
          path: artifacts/mutation-report.json
          if-no-files-found: error
          retention-days: 7

  flake-diagnostic:
    name: Concurrency and boundary flake diagnostic
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - name: Install OS sandbox backend for flake tests
        run: bash scripts/ci/setup-bubblewrap.sh
      - run: npm ci
      - name: Run flake policy self-tests
        run: node --test test/scripts-quality-gates.test.js
      - run: npm run test:flake
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: flake-report
          path: artifacts/flake-report.json
          if-no-files-found: error
          retention-days: 7
