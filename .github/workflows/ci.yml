name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}

    - name: Cache WinSW worker package binary
      uses: actions/cache@v5
      with:
        path: dist/.cache
        key: winsw-v2.12.0-${{ runner.os }}

    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Install browser runtime for Governed Browser Automation tests
      run: node scripts/install-browser.js --with-deps

    - name: Run tests
      run: npm run test:ci

    - name: Verify worker package
      run: npm pack --dry-run
