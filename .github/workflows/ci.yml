name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sidekick-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Metadata and architecture gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check:tests
      - run: npm run check:architecture
      - run: npm run check:docs
      - run: node --test test/run-all.test.js test/security/property-boundaries.test.js test/core/fault-injection.test.js

  domain-shards:
    name: ${{ matrix.domain }} / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        domain: [core, security, agent, packs, compute, platforms]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install browser runtime for browser shard only
        if: matrix.domain == 'platforms'
        run: node scripts/install-browser.js
      - name: Run domain shard
        run: node scripts/run-tests.js --domain=${{ matrix.domain }}
      - name: Upload bounded result summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: test-results-${{ matrix.domain }}-${{ matrix.node-version }}
          path: artifacts/test-results.json
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Legacy compatibility / Node ${{ matrix.node-version }}
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node scripts/run-tests.js --tier=compatibility

  package:
    name: Package and dependency checks
    needs: fast-gate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run package:worker
      - run: npm pack --dry-run

  coverage:
    name: Coverage policy / Node 22
    needs: domain-shards
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: coverage-summary
          path: artifacts/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
