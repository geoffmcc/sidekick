name: CI

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        persist-credentials: false

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ matrix.node-version }}

    - name: Cache WinSW worker package binary
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: dist/.cache
        key: winsw-v2.12.0-${{ runner.os }}

    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=moderate

    - name: Validate Docker Compose configuration
      env:
        SIDEKICK_SECRET_DIR: ${{ runner.temp }}/sidekick-secrets
        SIDEKICK_UID: "1000"
        SIDEKICK_GID: "1000"
      run: |
        mkdir -p "$SIDEKICK_SECRET_DIR"
        for name in sidekick_postgres_password sidekick_influx_password sidekick_influx_token sidekick_grafana_admin_password; do
          printf 'ci-placeholder\n' > "$SIDEKICK_SECRET_DIR/$name"
        done
        docker compose -f docker/docker-compose.yml config --quiet

    - name: Install browser runtime for Governed Browser Automation tests
      run: node scripts/install-browser.js

    - name: Run tests
      run: npm run test:ci

    - name: Verify worker package
      run: npm pack --dry-run
