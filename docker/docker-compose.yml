version: "3.8"

# Sidekick Docker Services
# These run as on-demand systemd wrappers (sidekick-postgres, sidekick-redis, etc.)
# Start individually: sudo systemctl start sidekick-postgres
# Or all at once: docker compose -f /home/sidekick/sidekick/docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: sidekick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sidekick
      POSTGRES_PASSWORD_FILE: /run/secrets/sidekick_postgres_password
      POSTGRES_DB: sidekick
    secrets:
      - sidekick_postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidekick"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: sidekick-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sidekick-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - qdrant

  influxdb:
    image: influxdb:2-alpine
    container_name: sidekick-influxdb
    restart: unless-stopped
    # Bind-mount access follows the deployment account instead of assuming
    # the sidekick user has a particular host UID/GID.
    user: "${SIDEKICK_UID:?set SIDEKICK_UID}:${SIDEKICK_GID:?set SIDEKICK_GID}"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: sidekick
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/sidekick_influx_password
      DOCKER_INFLUXDB_INIT_ORG: sidekick
      DOCKER_INFLUXDB_INIT_BUCKET: sidekick
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/sidekick_influx_token
    secrets:
      - sidekick_influx_password
      - sidekick_influx_token
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: sidekick-grafana
    restart: unless-stopped
    user: "${SIDEKICK_UID:?set SIDEKICK_UID}:${SIDEKICK_GID:?set SIDEKICK_GID}"
    environment:
      GF_SECURITY_ADMIN_USER: sidekick
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/sidekick_grafana_admin_password
      GF_SERVER_HTTP_PORT: "3000"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_ROOT_URL: ${SIDEKICK_GRAFANA_ROOT_URL:-http://localhost:4098/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      # Grafana Live rejects websocket requests whose browser origin is not
      # explicitly allowed. Keep the default origins narrow; deployments with
      # a different dashboard host should override this variable in .env.
      GF_LIVE_ALLOWED_ORIGINS: ${SIDEKICK_GRAFANA_ALLOWED_ORIGINS:-http://localhost:4098,http://127.0.0.1:4098,http://10.47.20.20:4098}
    entrypoint: ["/bin/sh", "-c"]
    command: ["set -eu; SIDEKICK_INFLUX_TOKEN=$$(cat /run/secrets/sidekick_influx_token); export SIDEKICK_INFLUX_TOKEN; exec /run.sh"]
    secrets:
      - sidekick_grafana_admin_password
      - sidekick_influx_token
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - grafana

secrets:
  sidekick_postgres_password:
    file: ${SIDEKICK_SECRET_DIR:?set SIDEKICK_SECRET_DIR}/sidekick_postgres_password
  sidekick_influx_password:
    file: ${SIDEKICK_SECRET_DIR:?set SIDEKICK_SECRET_DIR}/sidekick_influx_password
  sidekick_influx_token:
    file: ${SIDEKICK_SECRET_DIR:?set SIDEKICK_SECRET_DIR}/sidekick_influx_token
  sidekick_grafana_admin_password:
    file: ${SIDEKICK_SECRET_DIR:?set SIDEKICK_SECRET_DIR}/sidekick_grafana_admin_password
